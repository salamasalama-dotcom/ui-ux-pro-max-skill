<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talepler — Valera Panel</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo/favicon-32.png">
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="antialiased">
  <nav class="admin-nav">
    <a href="index.html" class="nav-brand">VALERA <span>Panel</span></a>
    <a href="index.html">Panel</a>
    <a href="urunler.html">Ürünler</a>
    <a href="talepler.html" class="active">Talepler</a>
    <div class="nav-actions">
      <a href="../index.html" target="_blank" class="btn btn-ghost btn-sm">Siteyi Gör ↗</a>
      <a href="#" data-logout class="btn btn-secondary btn-sm">Çıkış</a>
    </div>
  </nav>

  <main class="admin-main">
    <h1 style="font-size:36px;margin:0 0 20px;">Teklif Talepleri</h1>

    <div class="admin-card overflow-x-auto">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Tarih</th>
            <th>Ad Soyad</th>
            <th>İletişim</th>
            <th>Ürün</th>
            <th>Mesaj</th>
            <th>Durum</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leads-tbody">
          <tr><td colspan="7" class="text-center py-8" style="opacity:.6">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script>
    const statusLabel = { new: 'Yeni', read: 'Okundu', replied: 'Yanıtlandı' };

    async function loadLeads() {
      const tbody = document.getElementById('leads-tbody');
      const { data, error } = await supabaseClient.from('leads').select('*').order('created_at', { ascending: false });
      if (error) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8" style="color:var(--a-accent-700)">Yüklenemedi: ${escapeHtml(error.message)}</td></tr>`;
        return;
      }
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8" style="opacity:.6">Henüz talep yok.</td></tr>';
        return;
      }
      const statusTag = { new: 'tag-accent', read: 'tag-outline', replied: 'tag-neutral' };
      tbody.innerHTML = data.map((l) => `
        <tr>
          <td class="whitespace-nowrap">${new Date(l.created_at).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' })}</td>
          <td>${escapeHtml(l.name || '—')}</td>
          <td>
            <p>${escapeHtml(l.phone || '')}</p>
            <p style="font-size:12px;opacity:.6">${escapeHtml(l.email || '')}</p>
          </td>
          <td>${escapeHtml(l.product_interest || '—')}</td>
          <td class="max-w-xs">${escapeHtml(l.message || '—')}</td>
          <td><span class="tag ${statusTag[l.status] || 'tag-neutral'}">${statusLabel[l.status] || l.status}</span></td>
          <td class="whitespace-nowrap">
            ${l.status !== 'read' ? `<button class="btn btn-ghost btn-sm" data-status="${l.id}" data-value="read">Okundu İşaretle</button>` : ''}
            ${l.status !== 'replied' ? `<button class="btn btn-ghost btn-sm" data-status="${l.id}" data-value="replied">Yanıtlandı</button>` : ''}
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('[data-status]').forEach((el) => {
        el.addEventListener('click', async () => {
          const id = el.getAttribute('data-status');
          const value = el.getAttribute('data-value');
          const { error: updErr } = await supabaseClient.from('leads').update({ status: value }).eq('id', id);
          if (updErr) {
            alert('Güncellenemedi: ' + updErr.message);
            return;
          }
          loadLeads();
        });
      });
    }

    document.addEventListener('admin-ready', loadLeads);
  </script>
</body>
</html>
