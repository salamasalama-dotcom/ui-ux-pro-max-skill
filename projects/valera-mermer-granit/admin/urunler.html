<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürünler — Valera Panel</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo/favicon-32.png">
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="text-[var(--ink)] antialiased">
  <nav class="admin-nav">
    <div class="container-wide flex items-center justify-between py-4">
      <a href="index.html" class="font-display text-lg" style="color:var(--paper)">VALERA <span class="eyebrow-soft" style="color:rgba(245,242,236,.5)">Panel</span></a>
      <div class="flex items-center gap-6">
        <a href="index.html">Panel</a>
        <a href="urunler.html" class="active">Ürünler</a>
        <a href="talepler.html">Talepler</a>
        <a href="../index.html" target="_blank">Siteyi Gör ↗</a>
        <a href="#" data-logout>Çıkış</a>
      </div>
    </div>
  </nav>

  <main class="container-wide py-10">
    <div class="flex items-center justify-between mb-8">
      <h1 class="head-2">Ürünler</h1>
      <a href="urun-form.html" class="btn btn-primary btn-sm">+ Yeni Ürün</a>
    </div>

    <div class="admin-card overflow-x-auto">
      <table class="admin-table">
        <thead>
          <tr>
            <th></th>
            <th>Ad</th>
            <th>Tür</th>
            <th>Menşei</th>
            <th>Öne Çıkan</th>
            <th>Sıra</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="products-tbody">
          <tr><td colspan="7" class="text-center py-8 body-md">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script>
    async function loadProducts() {
      const tbody = document.getElementById('products-tbody');
      const { data, error } = await supabaseClient.from('products').select('*').order('sort_order', { ascending: true });
      if (error) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8" style="color:#b3413a">Yüklenemedi: ${escapeHtml(error.message)}</td></tr>`;
        return;
      }
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 body-md">Henüz ürün yok.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map((p) => `
        <tr>
          <td><img class="thumb" src="${escapeHtml(p.image)}" alt=""></td>
          <td>
            <p class="font-display">${escapeHtml(p.name_tr)}</p>
            <p class="eyebrow-soft">${escapeHtml(p.name_en)}</p>
          </td>
          <td><span class="badge badge-${p.type}">${p.type === 'granit' ? 'Granit' : 'Mermer'}</span></td>
          <td>${escapeHtml(p.origin || '—')}</td>
          <td>
            <input type="checkbox" data-featured-toggle="${p.id}" ${p.featured ? 'checked' : ''}>
          </td>
          <td>${p.sort_order}</td>
          <td class="text-right whitespace-nowrap">
            <a href="urun-form.html?id=${p.id}" class="icon-btn">Düzenle</a>
            <button class="icon-btn icon-btn-danger" data-delete="${p.id}" data-name="${escapeHtml(p.name_tr)}">Sil</button>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('[data-featured-toggle]').forEach((el) => {
        el.addEventListener('change', async () => {
          const id = el.getAttribute('data-featured-toggle');
          const { error: updErr } = await supabaseClient.from('products').update({ featured: el.checked }).eq('id', id);
          if (updErr) {
            alert('Güncellenemedi: ' + updErr.message);
            el.checked = !el.checked;
          }
        });
      });

      tbody.querySelectorAll('[data-delete]').forEach((el) => {
        el.addEventListener('click', async () => {
          const id = el.getAttribute('data-delete');
          const name = el.getAttribute('data-name');
          if (!confirm(`"${name}" ürünü silinsin mi? Bu işlem geri alınamaz.`)) return;
          const { error: delErr } = await supabaseClient.from('products').delete().eq('id', id);
          if (delErr) {
            alert('Silinemedi: ' + delErr.message);
            return;
          }
          loadProducts();
        });
      });
    }

    document.addEventListener('admin-ready', loadProducts);
  </script>
</body>
</html>
