<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel — Valera Mermer Granit</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo/favicon-32.png">
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="antialiased">
  <nav class="admin-nav">
    <a href="index.html" class="nav-brand">VALERA <span>Panel</span></a>
    <a href="index.html" class="active">Panel</a>
    <a href="urunler.html">Ürünler</a>
    <a href="talepler.html">Talepler</a>
    <div class="nav-actions">
      <a href="../index.html" target="_blank" class="btn btn-ghost btn-sm">Siteyi Gör ↗</a>
      <a href="#" data-logout class="btn btn-secondary btn-sm">Çıkış</a>
    </div>
  </nav>

  <main class="admin-main">
    <p style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin:0 0 8px;">Hoş geldiniz, <span data-admin-email></span></p>
    <h1 style="font-size:36px;margin:0 0 24px;">Panel</h1>

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
      <div class="stat-tile">
        <p class="card-kicker">Bugün Ziyaret</p>
        <p class="stat-num" id="stat-today">—</p>
      </div>
      <div class="stat-tile">
        <p class="card-kicker">Son 7 Gün Ziyaret</p>
        <p class="stat-num" id="stat-week">—</p>
      </div>
      <div class="stat-tile">
        <p class="card-kicker">Yeni Talep</p>
        <p class="stat-num" id="stat-leads">—</p>
      </div>
      <div class="stat-tile">
        <p class="card-kicker">Toplam Ürün</p>
        <p class="stat-num" id="stat-products">—</p>
      </div>
    </div>

    <div class="grid sm:grid-cols-2 gap-3">
      <a href="urunler.html" class="action-card">
        <p class="card-title">Ürünleri Yönet</p>
        <p class="card-body">Ekle, düzenle, sil, öne çıkar.</p>
      </a>
      <a href="talepler.html" class="action-card">
        <p class="card-title">Teklif Talepleri</p>
        <p class="card-body">İletişim formundan gelen talepleri görüntüle.</p>
      </a>
    </div>
  </main>

  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script>
    document.addEventListener('admin-ready', async () => {
      const startOfToday = new Date();
      startOfToday.setHours(0, 0, 0, 0);
      const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

      const [today, week, leads, products] = await Promise.all([
        supabaseClient.from('pageviews').select('id', { count: 'exact', head: true }).gte('visited_at', startOfToday.toISOString()),
        supabaseClient.from('pageviews').select('id', { count: 'exact', head: true }).gte('visited_at', sevenDaysAgo.toISOString()),
        supabaseClient.from('leads').select('id', { count: 'exact', head: true }).eq('status', 'new'),
        supabaseClient.from('products').select('id', { count: 'exact', head: true }),
      ]);

      document.getElementById('stat-today').textContent = today.count ?? '0';
      document.getElementById('stat-week').textContent = week.count ?? '0';
      document.getElementById('stat-leads').textContent = leads.count ?? '0';
      document.getElementById('stat-products').textContent = products.count ?? '0';
    });
  </script>
</body>
</html>
