<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetim Girişi — Valera Mermer Granit</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo/favicon-32.png">
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="antialiased">
  <div class="login-shell">
    <div class="login-card">
      <img src="../assets/logo/valera-logo-black.png" alt="Valera" class="h-8 w-auto mb-8 mx-auto">
      <p style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;opacity:.6;margin:0 0 24px;">Yönetim Paneli</p>
      <form id="login-form" class="space-y-5">
        <div class="field">
          <label for="email">E-posta</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <p id="login-error" class="text-sm hidden" style="color:var(--a-accent)"></p>
        <button type="submit" class="btn btn-primary w-full">Giriş Yap</button>
      </form>
    </div>
  </div>

  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = 'index.html';
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      errorEl.classList.add('hidden');
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = 'Giriş başarısız: e-posta veya şifre hatalı.';
        errorEl.classList.remove('hidden');
        return;
      }
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
